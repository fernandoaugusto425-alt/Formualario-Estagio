<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Figurinhas da Copa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row p-4 gap-4">

    <!-- PAINEL ESQUERDO: CONTROLES E VENDAS -->
    <div class="w-full md:w-1/3 flex flex-col gap-4">
        
        <!-- Bloco 1: Entrada Rápida -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold text-gray-700 flex items-center gap-2 mb-4">
                <i class="fa-solid fa-plus text-green-500"></i> Entrada Rápida
            </h2>
            <div class="flex gap-2">
                <input type="text" id="inputEntrada" placeholder="Ex: MEX1 (e aperte ENTER)" 
                       class="flex-1 border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-blue-400 uppercase font-bold text-gray-700 transition-colors">
                <button onclick="adicionarDoInput()" class="bg-blue-500 text-white px-4 py-2 rounded-xl hover:bg-blue-600 transition-colors font-bold shadow-sm">
                    Salvar
                </button>
            </div>
            <p id="msgEntrada" class="text-xs text-green-500 mt-2 font-semibold h-4"></p>
        </div>

        <!-- Bloco 2: Cruzar Lista do Cliente -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex-1 flex flex-col min-h-0">
            <h2 class="text-lg font-bold text-gray-700 flex items-center gap-2 mb-4">
                <i class="fa-solid fa-magnifying-glass text-blue-500"></i> Cruzar Lista do Cliente
            </h2>
            
            <div id="areaBusca" class="flex flex-col flex-1 min-h-0">
                <textarea id="textoLista" placeholder="Cole a lista do cliente aqui...&#10;Ex:&#10;MEX: 3, 7, 11&#10;Suíça (SUI):&#10;7, 10&#10;Coca-Cola (CC): CC4" 
                          class="flex-1 w-full border-2 border-gray-200 rounded-xl p-3 focus:outline-none focus:border-blue-400 resize-none mb-3 text-sm"></textarea>
                <button onclick="cruzarLista()" class="w-full bg-slate-800 text-white py-3 rounded-xl hover:bg-slate-700 transition-colors font-bold shadow-sm text-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check-double"></i> Verificar Disponibilidade
                </button>
            </div>

            <!-- Resultados do Cruzamento (Escondido por Padrão) -->
            <div id="areaResultado" class="hidden flex-col flex-1 min-h-0">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-gray-700 text-lg">Resultado</h3>
                    <button onclick="voltarBusca()" class="text-blue-500 hover:text-blue-700 text-sm font-semibold">Voltar</button>
                </div>

                <div class="flex-1 overflow-y-auto pr-2 space-y-4 scrollbar-hide">
                    <!-- Tenho -->
                    <div class="bg-green-50 border border-green-200 rounded-xl p-4">
                        <div class="flex justify-between items-center mb-2">
                            <h4 class="font-bold text-green-700 flex items-center gap-2">
                                <i class="fa-regular fa-circle-check"></i> Tenho (<span id="qtdTenho">0</span>)
                            </h4>
                            <span id="valorTotal" class="bg-green-600 text-white px-3 py-1 rounded-full text-sm font-bold shadow-sm">R$ 0,00</span>
                        </div>
                        <div id="listaTenho" class="flex flex-wrap gap-1"></div>
                    </div>

                    <!-- Falta -->
                    <div class="bg-red-50 border border-red-200 rounded-xl p-4">
                        <h4 class="font-bold text-red-700 flex items-center gap-2 mb-2">
                            <i class="fa-regular fa-circle-xmark"></i> Falta (<span id="qtdFalta">0</span>)
                        </h4>
                        <div id="listaFalta" class="flex flex-wrap gap-1"></div>
                    </div>
                </div>

                <div class="pt-4 mt-2 border-t border-gray-100">
                    <button id="btnDarBaixa" onclick="confirmarVenda()" class="w-full bg-green-500 text-white py-3 rounded-xl hover:bg-green-600 transition-colors font-bold shadow-sm text-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cart-shopping"></i> Dar OK (Baixa no Estoque)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- PAINEL DIREITO: ESTOQUE GERAL -->
    <div class="w-full md:w-2/3 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-cubes text-slate-500"></i> Meu Estoque
            </h2>
            <div class="text-sm font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-lg">
                Total: <span id="totalEstoque">0</span> figurinhas
            </div>
        </div>
        
        <!-- Grid de Figurinhas -->
        <div id="gridEstoque" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 overflow-y-auto pr-2 content-start flex-1">
            <!-- Os cards são injetados aqui pelo JavaScript -->
        </div>
    </div>

    <script>
        // === BANCO DE DADOS LOCAL ===
        let estoque = JSON.parse(localStorage.getItem('estoque_figurinhas')) || {};
        let vendaAtual = [];

        function salvarEstoque() {
            localStorage.setItem('estoque_figurinhas', JSON.stringify(estoque));
            renderizarEstoque();
        }

        // === REGRAS DE PREÇO ===
        function calcularPreco(codigo) {
            // Se o código termina com "1" (ex: MEX1), o preço é R$ 2,00. Caso contrário, R$ 1,50.
            const matchNumero = codigo.match(/\d+$/);
            if (matchNumero && matchNumero[0] === "1") {
                return 2.00;
            }
            return 1.50;
        }

        // === CÉREBRO DE LEITURA DAS LISTAS (NOVO E MELHORADO) ===
        function extrairCodigosDaLista(textoBruto) {
            const linhas = textoBruto.split(/\r?\n/);
            let prefixoAtual = "";
            let codigosEncontrados = new Set(); // Set evita figurinhas duplicadas na lista

            for (let linha of linhas) {
                linha = linha.trim();
                if (!linha) continue;

                // Tenta achar a sigla do país que vem antes de dois pontos ":"
                // Ex: "MEX:" ou "Suíça (SUI):"
                const prefixMatch = linha.match(/(?:\(([A-Za-z]{2,4})\)|([A-Za-z]{2,4}))\s*:/);
                if (prefixMatch) {
                    // Pega o grupo 1 (SUI) ou grupo 2 (MEX)
                    prefixoAtual = (prefixMatch[1] || prefixMatch[2]).toUpperCase();
                }

                // Quebra a linha por vírgulas, espaços, ou traços
                const pedacos = linha.split(/[\s,;\-]+/);

                for (let pedaco of pedacos) {
                    // Limpa tudo que não for letra ou número
                    let limpo = pedaco.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                    if (!limpo) continue;

                    // Se a palavra for exatamente a sigla (ex: "MEX"), ignora
                    if (limpo === prefixoAtual) continue;

                    // Se for apenas um NÚMERO (ex: "7"), junta com a sigla atual
                    if (/^\d+$/.test(limpo)) {
                        if (prefixoAtual) {
                            codigosEncontrados.add(prefixoAtual + limpo);
                        }
                    } 
                    // Se for LETRA + NÚMERO juntos (ex: "CC4", "FWC13"), adiciona direto
                    else if (/^[A-Z]+\d+$/.test(limpo)) {
                        codigosEncontrados.add(limpo);
                    }
                }
            }
            return Array.from(codigosEncontrados);
        }

        // === FUNÇÕES DE ESTOQUE ===
        function adicionarEstoque(codigo, quantidade = 1) {
            codigo = codigo.replace(/\s+/g, '').toUpperCase();
            // Valida se é formato Letra + Número
            if (!/^[A-Z]+\d+$/.test(codigo)) return false;

            if (estoque[codigo]) {
                estoque[codigo] += quantidade;
            } else {
                estoque[codigo] = quantidade;
            }
            salvarEstoque();
            return true;
        }

        function alterarQuantidade(codigo, delta) {
            if (estoque[codigo]) {
                estoque[codigo] += delta;
                if (estoque[codigo] <= 0) {
                    delete estoque[codigo];
                }
                salvarEstoque();
            }
        }

        function removerItem(codigo) {
            delete estoque[codigo];
            salvarEstoque();
        }

        // === INTERAÇÃO COM A TELA ===
        const inputEntrada = document.getElementById('inputEntrada');
        const msgEntrada = document.getElementById('msgEntrada');

        inputEntrada.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                adicionarDoInput();
            }
        });

        function adicionarDoInput() {
            const val = inputEntrada.value;
            if (val) {
                const sucesso = adicionarEstoque(val);
                if (sucesso) {
                    msgEntrada.textContent = val.toUpperCase() + " adicionado!";
                    setTimeout(() => msgEntrada.textContent = "", 2000);
                    inputEntrada.value = "";
                } else {
                    msgEntrada.textContent = "Código inválido! Use formato MEX1";
                    msgEntrada.classList.replace('text-green-500', 'text-red-500');
                    setTimeout(() => {
                        msgEntrada.textContent = "";
                        msgEntrada.classList.replace('text-red-500', 'text-green-500');
                    }, 2000);
                }
            }
            inputEntrada.focus();
        }

        function renderizarEstoque() {
            const grid = document.getElementById('gridEstoque');
            grid.innerHTML = '';
            
            // Ordenar alfabeticamente/numéricamente
            const codigosOrdem = Object.keys(estoque).sort((a, b) => {
                const prefixA = a.match(/[A-Z]+/)[0];
                const prefixB = b.match(/[A-Z]+/)[0];
                if (prefixA !== prefixB) return prefixA.localeCompare(prefixB);
                
                const numA = parseInt(a.match(/\d+/)[0]);
                const numB = parseInt(b.match(/\d+/)[0]);
                return numA - numB;
            });

            let totalCards = 0;

            codigosOrdem.forEach(codigo => {
                const qtd = estoque[codigo];
                totalCards += qtd;

                const preco = calcularPreco(codigo);
                const isBrilhante = preco === 2.00;

                const card = document.createElement('div');
                card.className = "bg-white border rounded-xl p-3 flex flex-col justify-between shadow-sm relative";
                if(isBrilhante) card.classList.add("border-amber-200", "bg-amber-50/30");
                else card.classList.add("border-gray-200");

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="font-bold text-gray-800 text-base">${codigo}</span>
                        <span class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded">x${qtd}</span>
                    </div>
                    <div class="flex items-center justify-between gap-1">
                        <div class="flex bg-gray-100 rounded-lg overflow-hidden border border-gray-200">
                            <button onclick="alterarQuantidade('${codigo}', -1)" class="px-2 py-1 hover:bg-gray-200 text-gray-600"><i class="fa-solid fa-minus text-xs"></i></button>
                            <span class="px-2 py-1 text-sm font-bold bg-white w-6 text-center">${qtd}</span>
                            <button onclick="alterarQuantidade('${codigo}', 1)" class="px-2 py-1 hover:bg-gray-200 text-gray-600"><i class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                        <button onclick="removerItem('${codigo}')" class="text-red-400 hover:text-red-600 px-2 py-1 rounded-lg hover:bg-red-50 transition-colors">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('totalEstoque').textContent = totalCards;
        }

        // === CRUZAMENTO E VENDAS ===
        function cruzarLista() {
            const textoBruto = document.getElementById('textoLista').value;
            if(!textoBruto.trim()) return;

            const listaCliente = extrairCodigosDaLista(textoBruto);
            
            const tenho = [];
            const falta = [];
            let valorTotal = 0;

            // Criar cópia temporária do estoque para garantir que não vamos vender mais do que temos da mesma figurinha na lista
            let estoqueTemp = {...estoque};

            listaCliente.forEach(codigo => {
                if (estoqueTemp[codigo] && estoqueTemp[codigo] > 0) {
                    tenho.push(codigo);
                    estoqueTemp[codigo] -= 1; // Deduz na simulação
                    valorTotal += calcularPreco(codigo);
                } else {
                    falta.push(codigo);
                }
            });

            vendaAtual = tenho; // Salva o que deu "match" para a baixa

            // Renderizar Resultados
            document.getElementById('qtdTenho').textContent = tenho.length;
            document.getElementById('qtdFalta').textContent = falta.length;
            document.getElementById('valorTotal').textContent = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;

            const containerTenho = document.getElementById('listaTenho');
            containerTenho.innerHTML = tenho.map(c => 
                `<span class="px-2 py-1 text-xs font-bold text-green-700 bg-white border border-green-300 rounded-md shadow-sm">${c}</span>`
            ).join('');

            const containerFalta = document.getElementById('listaFalta');
            containerFalta.innerHTML = falta.map(c => 
                `<span class="px-2 py-1 text-xs font-bold text-red-600 bg-white border border-red-300 rounded-md">${c}</span>`
            ).join('');

            // Trocar Telas
            document.getElementById('areaBusca').classList.add('hidden');
            document.getElementById('areaResultado').classList.remove('hidden');
            document.getElementById('areaResultado').classList.add('flex');
            
            // Habilita ou desabilita botão de baixa
            const btnBaixa = document.getElementById('btnDarBaixa');
            if (tenho.length === 0) {
                btnBaixa.classList.add('opacity-50', 'cursor-not-allowed');
                btnBaixa.disabled = true;
            } else {
                btnBaixa.classList.remove('opacity-50', 'cursor-not-allowed');
                btnBaixa.disabled = false;
            }
        }

        function voltarBusca() {
            document.getElementById('areaResultado').classList.add('hidden');
            document.getElementById('areaResultado').classList.remove('flex');
            document.getElementById('areaBusca').classList.remove('hidden');
            vendaAtual = [];
        }

        function confirmarVenda() {
            if(vendaAtual.length === 0) return;

            // Da a baixa real no estoque local
            vendaAtual.forEach(codigo => {
                alterarQuantidade(codigo, -1);
            });

            alert(`Venda confirmada! ${vendaAtual.length} figurinhas removidas do estoque.`);
            document.getElementById('textoLista').value = ""; // Limpa a caixa de texto
            voltarBusca();
        }

        // Inicializa ao carregar
        renderizarEstoque();
    </script>
</body>
</html>
